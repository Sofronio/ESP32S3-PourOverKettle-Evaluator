[env:esp32s3]
; 复刻 GaggiMate 主板(YD-ESP32-S3)的已验证配方:
;   espressif32@6.12.0 + boards/YD-ESP32-S3.json 板卡 (qio_opi / default_8MB.csv / 80MHz)
; 7.0.1 + 自定义分区表在这块板上会启动循环 (rst:0x3), 勿改回
platform = espressif32@6.12.0
board = YD-ESP32-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; 构建前从 wifi-config.txt 生成 include/wifi_config.h
extra_scripts = pre:scripts/gen_wifi_config.py
